name: Build Applications

on:
  push:
    branches:
      - workflow

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: test_app
          buildozer_version: stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v2
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}

  build_ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install pygame
          pip install numpy
          pip install z3-solver
          export Z3_LIBRARY_PATH=/home/runner/.local/lib/python3.10/site-packages/z3/lib/

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build EXE for Linux
        run: |
          cd ./src
          pyinstaller main.spec

      - name: Upload Artifact for Linux
        uses: actions/upload-artifact@v2
        with:
          name: linux_exe
          path: ./src/dist/HexagonPuzzle

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install pygame
          pip install numpy
          pip install z3-solver

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build EXE for Windows
        run: |
          cd ./src
          pyinstaller main.spec

      - name: Upload Artifact for Windows
        uses: actions/upload-artifact@v2
        with:
          name: windows_exe
          path: ./src/dist/HexagonPuzzle.exe

  build_macos:
    runs-on: macos-latest

    steps:
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install pygame
          pip install numpy
          pip install z3-solver

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build APP for macOS
        run: |
          cd ./src
          pyinstaller main.spec
          mv dist/HexagonPuzzle dist/HexagonPuzzle.app

      - name: Upload Artifact for macOS
        uses: actions/upload-artifact@v2
        with:
          name: macos_app
          path: ./src/dist/HexagonPuzzle.app
