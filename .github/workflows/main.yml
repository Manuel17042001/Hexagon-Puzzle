name: CI

on:
  push:
    branches:
      - workflow

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Buildozer Dependencies
        run: |
          pip install --user --upgrade buildozer
          sudo apt-get update
          pip install cython
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev

      - name: Checkout-Repository
        uses: actions/checkout@v2

      - name: Accept Buildozer 3 licenses
        run: |
          echo "y" | buildozer license accept
          echo "y" | buildozer android debug
          echo "y" | buildozer ios debug

      - name: Build APK
        run: |
          cd ./src
          buildozer -v android debug
