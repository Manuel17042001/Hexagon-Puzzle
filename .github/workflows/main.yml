name: CI

on:
  push:
    branches:
      - workflow

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Buildozer Dependencies
        run: |
          pip install --user --upgrade buildozer
          sudo apt-get update
          pip install cython
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev
            ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "build-tools;29.0.0"

      - name: Checkout-Repository
        uses: actions/checkout@v2

      - name: Build APK
        run: |
          cd ./src
          echo y | buildozer -v android debug

  build-exe:
    runs-on: ubuntu-22.04

    steps:
      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build EXE
        run: |
          cd ./src
          pyinstaller --onefile main.py
          tree .

      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: your_script_exe
          path: ./src/dist/main.exe
